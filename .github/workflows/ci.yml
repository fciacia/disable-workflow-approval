name: CI

on:
  push:
    branches: [main]
  pull_request_target:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: |
          echo "Running CI checks..."
          echo "PR/commit is: ${{ github.event_name }}"
          cat VERSION.txt
